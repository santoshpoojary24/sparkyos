<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparky OS | Neural Link</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #020408;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --sidebar-glass: rgba(6, 10, 20, 0.9);
            --glass-border: rgba(0, 240, 255, 0.3);
            --text-main: #eef5ff;
            --text-muted: #8b9bb4;
            --msg-ai: rgba(12, 20, 35, 0.85);
            --accent-glow: #00f0ff;
            --accent-secondary: #3b82f6;
            --accent-pink: #ff0055;
            --msg-user: linear-gradient(135deg, var(--accent-secondary), var(--accent-glow));
            --shadow-float: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
            --code-bg: #090d14;
            --code-text: #e2e8f0;
            --hover-bg: rgba(0, 240, 255, 0.15);
            --blur-intensity: blur(25px);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100dvh; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: crosshair;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        button, a, .history-item { touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }

        /* --- SCI-FI GLITTER CANVAS BACKGROUND --- */
        #sciFiCanvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none; opacity: 0.9;
        }

        .anti-gravity-app { display: flex; width: 100%; height: 100%; position: relative; z-index: 10; }

        /* --- SIDEBAR --- */
        .glass-sidebar { 
            width: 290px; flex-shrink: 0; background: var(--sidebar-glass); backdrop-filter: var(--blur-intensity); 
            border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; padding: 28px 20px; 
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), margin 0.4s ease; z-index: 50; 
            box-shadow: 15px 0 50px rgba(0,0,0,0.8); height: 100dvh; overflow-y: auto; overflow-x: hidden;
        }
        .glass-sidebar::-webkit-scrollbar { width: 3px; }
        .glass-sidebar::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.5); border-radius: 10px; }
        .glass-sidebar.hidden { margin-left: -290px; }
        
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 45; opacity: 0; transition: opacity 0.4s ease; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        
        .logo-section { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); flex-shrink: 0; }
        
        /* --- EXTREME CINEMATIC LOGO GLITCH --- */
        .logo-main { 
            position: relative; font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900; 
            letter-spacing: 5px; background: linear-gradient(135deg, var(--accent-glow), var(--accent-secondary)); 
            -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 12px; 
            display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 1; text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
        }
        .logo-main::before, .logo-main::after { 
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg-deep); color: #fff; z-index: -1; overflow: hidden; pointer-events: none; 
        }
        .logo-main:hover::before { 
            left: 4px; text-shadow: -3px 0 var(--accent-pink); 
            animation: glitch-anim-1 1s infinite linear alternate-reverse; background: transparent;
        }
        .logo-main:hover::after { 
            left: -4px; text-shadow: 3px 0 var(--accent-glow); 
            animation: glitch-anim-2 1.5s infinite linear alternate-reverse; background: transparent;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 40% 0); transform: translate(1px, -1px); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 1px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 1px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, -1px); }
        }

        .logo-sub { font-size: 0.7rem; font-weight: 700; color: var(--accent-glow); letter-spacing: 5px; text-transform: uppercase; background: rgba(0, 240, 255, 0.05); display: inline-block; padding: 6px 18px; border-radius: 4px; border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }

        /* --- COOL BUTTON ANIMATIONS --- */
        @keyframes shimmerWipe {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .new-chat-btn { 
            width: 100%; padding: 14px; background: rgba(0, 240, 255, 0.05); border: 1px solid var(--accent-glow); 
            border-radius: 8px; font-weight: 700; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; 
            display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--accent-glow); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: 24px; position: relative; overflow: hidden; flex-shrink: 0; 
            background-image: linear-gradient(120deg, transparent 20%, rgba(0, 240, 255, 0.2) 40%, rgba(255, 255, 255, 0.4) 50%, rgba(0, 240, 255, 0.2) 60%, transparent 80%);
            background-size: 200% 100%;
        }
        @media (hover: hover) { 
            .new-chat-btn:hover { 
                transform: translateY(-3px); box-shadow: 0 5px 25px rgba(0, 240, 255, 0.5); color: #fff; 
                animation: shimmerWipe 2s infinite linear; 
            } 
        }
        .new-chat-btn:active { transform: scale(0.95); box-shadow: 0 0 30px rgba(0, 240, 255, 0.8); }

        .chat-history-list { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .chat-history-list::-webkit-scrollbar { display: none; }
        .history-item { padding: 14px 16px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; font-size: 0.85rem; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
        .history-item::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--accent-glow); transform: scaleY(0); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .history-item.active { background: rgba(0, 240, 255, 0.1); color: var(--accent-glow); border-color: rgba(0, 240, 255, 0.3); box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1); }
        .history-item.active::before { transform: scaleY(1); }
        @media (hover: hover) { .history-item:hover { background: rgba(0,240,255,0.05); color: #fff; transform: translateX(5px); } }
        
        .delete-conv { background: none; border: none; color: var(--accent-pink); opacity: 0; transition: 0.2s; padding: 4px; font-size: 1.1rem; }
        .history-item:hover .delete-conv, .history-item:active .delete-conv { opacity: 1; transform: scale(1.2) rotate(90deg); }
        @media (max-width: 768px) { .delete-conv { opacity: 1; } }

        .sidebar-footer { padding-top: 20px; border-top: 1px solid rgba(0, 240, 255, 0.2); flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }

        /* --- CHAT WORKSPACE --- */
        .chat-workspace { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; z-index: 20; }
        .workspace-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 20; background: linear-gradient(to bottom, rgba(2,4,8,0.95), transparent); }
        
        .tool-btn { 
            background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); 
            border-radius: 12px; width: 50px; height: 50px; color: var(--text-muted); 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; position: relative; overflow: hidden;
        }
        @media (hover: hover) { 
            .tool-btn:hover { color: var(--accent-glow); border-color: var(--accent-glow); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); transform: translateY(-3px) scale(1.05); } 
            .tool-btn.highlight:hover { color: var(--accent-pink); border-color: var(--accent-pink); box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }
        }
        .tool-btn:active { transform: scale(0.9); box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.5); }

        /* Desktop chat feed padding */
        .chat-feed { flex: 1; overflow-y: auto; padding: 20px 30px 200px; display: flex; flex-direction: column; gap: 28px; scroll-behavior: smooth; }
        
        .message { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s; will-change: transform; display: flex; flex-direction: column; max-width: 85%; animation: holoIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .chat-feed::-webkit-scrollbar { width: 6px; }
        .chat-feed::-webkit-scrollbar-track { background: transparent; }
        .chat-feed::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.4); border-radius: 10px; }
        
        @keyframes holoIn { from { opacity: 0; transform: translateY(40px) scale(0.9) perspective(600px) rotateX(-15deg); filter: blur(8px); } to { opacity: 1; transform: translateY(0) scale(1) perspective(600px) rotateX(0deg); filter: blur(0); } }
        
        .user-message { align-self: flex-end; }
        .ai-message { align-self: flex-start; }
        .message-bubble { padding: 18px 26px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; box-shadow: var(--shadow-float); backdrop-filter: blur(15px); border: 1px solid transparent; word-wrap: break-word; letter-spacing: 0.3px; position: relative; }
        .user-message .message-bubble { background: var(--msg-user); color: white; border-bottom-right-radius: 4px; border-top-right-radius: 4px; box-shadow: 0 10px 30px rgba(0, 240, 255, 0.25); }
        .ai-message .message-bubble { background: var(--msg-ai); border-color: rgba(0, 240, 255, 0.3); border-bottom-left-radius: 4px; border-top-left-radius: 4px; border-left: 3px solid var(--accent-glow); }
        
        .ai-message pre { background: var(--code-bg); padding: 18px; border-radius: 8px; overflow-x: auto; margin: 15px 0; border: 1px solid rgba(0, 240, 255, 0.2); -webkit-overflow-scrolling: touch; box-shadow: inset 0 0 20px rgba(0,0,0,0.9); position: relative; }
        .ai-message code { font-family: 'Courier New', Courier, monospace; font-size: 0.9em; background: rgba(0,0,0,0.5); padding: 3px 6px; border-radius: 4px; color: var(--accent-glow); }
        .ai-message pre code { background: transparent; padding: 0; color: #e2e8f0; }
        .copy-code-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,240,255,0.08); border: 1px solid rgba(0,240,255,0.35); color: var(--accent-glow); border-radius: 6px; padding: 4px 10px; font-size: 0.7rem; cursor: pointer; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; transition: all 0.3s; z-index: 10; }
        .copy-code-btn:hover { background: rgba(0,240,255,0.25); box-shadow: 0 0 10px rgba(0,240,255,0.4); }
        .copy-code-btn.copied { background: rgba(0,255,100,0.12); border-color: rgba(0,255,100,0.5); color: #00ff64; }

        /* QUANTUM CORE PULSE LOADER (Kept as fallback) */
        .quantum-thinker { display: flex; align-items: center; gap: 20px; background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(15px); border-radius: 60px; padding: 14px 32px; width: fit-content; border: 1px solid var(--accent-glow); box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1); }
        .neural-core { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .core-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid transparent; border-top: 3px solid var(--accent-glow); border-right: 2px solid rgba(255,0,85,0.8); animation: spinRing 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }
        .core-ring-reverse { position: absolute; width: 75%; height: 75%; border-radius: 50%; border: 2px solid transparent; border-bottom: 2px solid var(--accent-secondary); border-left: 2px solid rgba(0, 240, 255, 0.8); animation: spinRingReverse 1.2s linear infinite; }
        .core-pulse { width: 12px; height: 12px; background: #fff; border-radius: 50%; animation: quantumPulse 1s ease-in-out infinite; box-shadow: 0 0 20px #fff, 0 0 40px var(--accent-glow); z-index: 2; }
        @keyframes spinRing { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes spinRingReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes quantumPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.8); opacity: 1; } }
        .thinking-text { font-weight: 800; letter-spacing: 3px; color: var(--accent-glow); font-size: 0.85rem; text-transform: uppercase; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px var(--accent-glow); }
        .thinking-dots { display: inline-flex; gap: 5px; margin-left: 5px; }
        .thinking-dots span { width: 6px; height: 6px; background: var(--accent-pink); border-radius: 50%; animation: dotBlink 1s infinite; box-shadow: 0 0 10px var(--accent-pink); }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBlink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* --- INPUT ZONE & ANIMATED SEARCH BAR --- */
        .input-zone { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 30px 30px; background: linear-gradient(to top, rgba(2,4,8,1) 70%, transparent); z-index: 100; }
        
        @keyframes borderPulse {
            0% { box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.05); }
            50% { box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 40px rgba(0, 240, 255, 0.6), inset 0 0 25px rgba(0, 240, 255, 0.2); }
            100% { box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.05); }
        }
        @keyframes inputScan { 0% { left: -50%; } 100% { left: 150%; } }

        .floating-input-form { 
            max-width: 900px; margin: 0 auto; background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 10px 18px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,240,255,0.05); 
            position: relative; overflow: hidden;
        }
        .floating-input-form::after {
            content: ''; position: absolute; bottom: 0; left: -100%; width: 50%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            transition: 0.5s; opacity: 0; pointer-events: none;
        }
        .floating-input-form:focus-within { 
            border-color: var(--accent-glow); 
            animation: borderPulse 2.5s infinite; 
            transform: translateY(-3px); 
        }
        .floating-input-form:focus-within::after {
            animation: inputScan 2s linear infinite; opacity: 1;
        }

        .input-row { display: flex; gap: 14px; align-items: flex-end; position: relative; z-index: 2; }
        .prompt-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; resize: none; max-height: 150px; padding: 14px 10px; font-family: 'Inter', sans-serif; width: 100%; line-height: 1.5; }
        .prompt-input::placeholder { color: #475569; transition: color 0.3s; }
        .prompt-input:focus::placeholder { color: var(--accent-glow); opacity: 0.5; }
        
        .action-btn { background: transparent; border: none; color: #64748b; font-size: 1.4rem; padding: 10px; border-radius: 50%; transition: 0.3s; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        @media (hover: hover) { .action-btn:hover { color: var(--accent-glow); background: rgba(0,240,255,0.1); transform: scale(1.1); text-shadow: 0 0 10px var(--accent-glow); } }
        .recording { color: var(--accent-pink) !important; animation: pulse-pink 1s infinite; text-shadow: 0 0 15px var(--accent-pink); }
        @keyframes pulse-pink { 50% { opacity: 0.5; box-shadow: inset 0 0 20px var(--accent-pink); transform: scale(1.1); } }

        @keyframes neonPulse { 0% { box-shadow: 0 0 10px rgba(0,240,255,0.4); } 50% { box-shadow: 0 0 25px rgba(0,240,255,0.8), 0 0 10px #fff; } 100% { box-shadow: 0 0 10px rgba(0,240,255,0.4); } }
        
        .send-action { background: var(--accent-glow); color: #000; border: none; border-radius: 14px; width: 48px; height: 48px; font-size: 1.2rem; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 15px rgba(0,240,255,0.4); position: relative; overflow: hidden; }
        .send-action:not(:disabled) { animation: neonPulse 2s infinite; }
        .send-action::after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; transition: width 0.3s, height 0.3s, opacity 0.3s; }
        .send-action:not(:disabled):active::after { width: 150px; height: 150px; opacity: 1; transition: 0s; }
        @media (hover: hover) { .send-action:hover:not(:disabled) { transform: scale(1.15) rotate(-10deg); box-shadow: 0 0 30px rgba(0, 240, 255, 0.8); background: #fff; } }
        .send-action:disabled { background: #1e293b; color: #94a3b8; box-shadow: none; animation: none; cursor: not-allowed; }
        
        .stop-action { background: rgba(255,0,85,0.1); color: var(--accent-pink); border: 1px solid var(--accent-pink); border-radius: 14px; width: 48px; height: 48px; justify-content: center; align-items: center; display: none; transition: 0.3s; flex-shrink: 0; font-size: 1.2rem; box-shadow: 0 0 15px rgba(255,0,85,0.3); }
        @media (hover: hover) { .stop-action:hover { background: var(--accent-pink); color: #fff; box-shadow: 0 0 30px rgba(255,0,85,0.8); transform: scale(1.1); } }

        .toast-msg { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(6, 10, 20, 0.95); border: 1px solid var(--accent-glow); color: #fff; padding: 14px 28px; border-radius: 10px; z-index: 1000; font-size: 0.9rem; font-family: 'Orbitron', sans-serif; box-shadow: 0 0 30px rgba(0,240,255,0.4); white-space: nowrap; letter-spacing: 1px; animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes toastIn { from { bottom: -30px; opacity: 0; transform: translate(-50%, 20px); } to { bottom: 40px; opacity: 1; transform: translate(-50%, 0); } }

        .scroll-to-bottom { position: fixed; bottom: 130px; right: 30px; background: rgba(6, 10, 20, 0.9); border: 1px solid var(--accent-glow); border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; z-index: 50; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: scale(0.5) translateY(20px); pointer-events: none; color: var(--accent-glow); font-size: 1.3rem; box-shadow: 0 0 25px rgba(0,240,255,0.3); }
        .scroll-to-bottom.visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
        @media (hover: hover) { .scroll-to-bottom:hover { background: var(--accent-glow); color: #000; box-shadow: 0 0 40px rgba(0,240,255,0.8); transform: scale(1.1); } }

        /* --- THE EMPTY STATE (Front Page Welcome) --- */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin: auto; text-align: center; color: var(--text-muted); opacity: 0;
            animation: fadeInState 1s ease-out forwards; padding: 20px;
            max-width: 500px;
        }
        @keyframes fadeInState { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .empty-icon { font-size: 3.5rem; color: var(--accent-glow); margin-bottom: 25px; filter: drop-shadow(0 0 20px var(--accent-glow)); animation: pulseNode 3s infinite alternate ease-in-out; }
        @keyframes pulseNode { 0% { transform: scale(0.95); opacity: 0.6; } 100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 35px var(--accent-glow)); } }

<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<script>
    // ------------------------- UPGRADED GLITTER CANVAS BACKGROUND (Touch + Glow) -------------------------
    const canvas = document.getElementById('sciFiCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;
    let mouse = { x: undefined, y: undefined, radius: 180 };

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        const numParticles = Math.floor((width * height) / 9000); // Dense starfield
        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }
    }

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2.5 + 0.5;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = (Math.random() * 30) + 1;
            this.twinkleSpeed = Math.random() * 0.05 + 0.01;
            this.alpha = Math.random();
        }
        draw() {
            // Glitter twinkle effect
            this.alpha += this.twinkleSpeed;
            if(this.alpha > 1 || this.alpha < 0.2) this.twinkleSpeed = -this.twinkleSpeed;
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0, 240, 255, 1)';
            ctx.fillStyle = `rgba(0, 240, 255, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0; // reset for lines
        }
        update() {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let forceDirectionX = dx / distance;
            let forceDirectionY = dy / distance;
            let maxDistance = mouse.radius;
            let force = (maxDistance - distance) / maxDistance;
            let directionX = forceDirectionX * force * this.density;
            let directionY = forceDirectionY * force * this.density;

            if (distance < mouse.radius) {
                this.x -= directionX;
                this.y -= directionY;
            } else {
                if (this.x !== this.baseX) {
                    let dx = this.x - this.baseX;
                    this.x -= dx / 20;
                }
                if (this.y !== this.baseY) {
                    let dy = this.y - this.baseY;
                    this.y -= dy / 20;
                }
            }
        }
    }

    function connectParticles() {
        for (let a = 0; a < particles.length; a++) {
            for (let b = a; b < particles.length; b++) {
                let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x))
                             + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                if (distance < (canvas.width / 6) * (canvas.height / 6)) {
                    let opacity = 1 - (distance / 25000);
                    ctx.strokeStyle = `rgba(0, 240, 255, ${opacity * 0.4})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    function animateCanvas() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        connectParticles();
        requestAnimationFrame(animateCanvas);
    }

    window.addEventListener('resize', initCanvas);
    // Mouse tracking
    window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
    window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; });
    // Phone touch tracking
    window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
    window.addEventListener('touchend', () => { mouse.x = undefined; mouse.y = undefined; });
    
    initCanvas();
    animateCanvas();


    // ------------------------- SCI-FI MUSIC PLAYER (FIXED) -------------------------
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const nextMusicBtn = document.getElementById('nextMusicBtn');
    const cyberpunkMusic = document.getElementById('cyberpunkMusic');
    
    // Direct, reliable, open-access MP3 files
    const tracks = [
        "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=cyberpunk-2099-10701.mp3",
        "https://cdn.pixabay.com/download/audio/2021/11/25/audio_91b3cb0154.mp3?filename=cyber-war-126419.mp3",
        "https://cdn.pixabay.com/download/audio/2022/03/15/audio_247ba84ed4.mp3?filename=cinematic-time-lapse-115672.mp3",
        "https://cdn.pixabay.com/download/audio/2022/02/10/audio_fc48af67b2.mp3?filename=space-ambience-56265.mp3"
    ];
    let currentTrackIndex = 0;
    let isMusicPlaying = false;
    
    cyberpunkMusic.src = tracks[currentTrackIndex];

    function playAudio() {
        cyberpunkMusic.volume = 0.2; 
        cyberpunkMusic.play().then(() => {
            musicToggleBtn.innerHTML = '<i class="fa-solid fa-compact-disc fa-spin"></i>';
            musicToggleBtn.style.color = "var(--accent-glow)";
            musicToggleBtn.style.borderColor = "var(--accent-glow)";
            musicToggleBtn.style.boxShadow = "0 0 20px rgba(0, 240, 255, 0.4)";
            nextMusicBtn.style.display = "inline-flex";
            isMusicPlaying = true;
        }).catch(e => {
            showToast("Tap anywhere on the screen first to allow audio playback.");
        });
    }

    function pauseAudio() {
        cyberpunkMusic.pause();
        musicToggleBtn.innerHTML = '<i class="fa-solid fa-music"></i>';
        musicToggleBtn.style.color = "var(--text-muted)";
        musicToggleBtn.style.boxShadow = "none";
        musicToggleBtn.style.borderColor = "var(--glass-border)";
        nextMusicBtn.style.display = "none";
        isMusicPlaying = false;
    }

    musicToggleBtn.onclick = () => { isMusicPlaying ? pauseAudio() : playAudio(); };
    nextMusicBtn.onclick = () => {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        cyberpunkMusic.src = tracks[currentTrackIndex];
        if (isMusicPlaying) playAudio();
    };

    // ------------------------- Global State -------------------------
    const SERVER_URL = "/api/chat";
    let currentAbortController = null;
    let isAudioEnabled = true;
    let currentConversationId = null;
    let conversations = new Map();
    let isGenerating = false;

    const chatFeed = document.getElementById('chatFeed');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const micBtn = document.getElementById('micBtn');
    const voiceToggleBtn = document.getElementById('voiceToggleBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyListDiv = document.getElementById('historyList');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const toggleSidebarBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const scrollToBottomBtn = document.getElementById('scrollToBottom');
    
    // Modal Elements
    const infoModalBtn = document.getElementById('infoModalBtn');
    const dossierModal = document.getElementById('dossierModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // ------------------------- FULL UNCOMPROMISED CLASSIFIED DOSSIER INTRO -------------------------
    const introHTML = `
        <div class="dossier-wrapper">
            <div class="dossier-content">
                <div class="dossier-header">
                    <div class="avatar-frame">
                        <div class="avatar-glitch"><i class="fa-solid fa-user-astronaut"></i></div>
                    </div>
                    <div class="developer-info">
                        <h2>CLASSIFIED: DEVELOPER</h2>
                        <h1>SANTOSH POOJARY</h1>
                        <div class="contact-badges">
                            <a href="https://www.instagram.com/xxiv.sparky?igsh=MXRteGR2enZ4bHhqcw%3D%3D&utm_source=qr" target="_blank" class="insta-badge">
                                <i class="fa-brands fa-instagram"></i> @xxiv.sparky
                            </a>
                            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=santoshpoojary2004@gmail.com" target="_blank" class="email-badge">
                                <i class="fa-solid fa-envelope"></i> EMAIL
                            </a>
                        </div>
                    </div>
                </div>
                <div class="dossier-body">
                    <h3><i class="fa-solid fa-id-card"></i> ABOUT THE ARCHITECT</h3>
                    <p>Designed and engineered by <strong>Santosh Poojary</strong>. This project represents a fusion of cyberpunk aesthetics and high-performance AI integration.</p>

                    <h3><i class="fa-solid fa-microchip"></i> PROJECT OVERVIEW</h3>
                    <p>Sparky OS is a sophisticated AI Neural Link designed to act as a seamless extension of human intelligence. It provides high-speed data processing, creative brainstorming, and technical problem-solving within a specialized glass-morphic environment.</p>

                    <h3><i class="fa-solid fa-shield-halved"></i> SYSTEM UTILITY</h3>
                    <ul>
                        <li><i class="fa-solid fa-bolt-lightning"></i> <span><strong>Efficiency:</strong> Rapid response generation powered by DeepSeek nodes.</span></li>
                        <li><i class="fa-solid fa-mobile-screen"></i> <span><strong>Mobility:</strong> Fully optimized for touch-sensitive and responsive mobile use.</span></li>
                        <li><i class="fa-solid fa-user-shield"></i> <span><strong>Security:</strong> Encrypted authorization gateway and data purge protocols.</span></li>
                    </ul>
                </div>
            </div>
        </div>
    `;
    
    // ------------------------- EMPTY STATE HTML (WELCOME NODE) -------------------------
    const emptyStateHTML = `
        <div class="empty-state" id="emptyStateDisplay">
            <div class="empty-icon"><i class="fa-solid fa-network-wired"></i></div>
            <h2>SYSTEM READY</h2>
            <p>Welcome to Sparky OS Neural Link.<br>A tactical AI environment optimized for rapid problem-solving, code generation, and data synthesis. Secure connection established. Enter your prompt below to initiate.</p>
        </div>
    `;

    // Inject HTML into the modal container once
    dossierModal.insertAdjacentHTML('beforeend', introHTML);

    // Modal Toggle Logic
    infoModalBtn.onclick = () => {
        dossierModal.classList.add('active');
    };
    
    closeModalBtn.onclick = () => {
        dossierModal.classList.remove('active');
    };
    
    // Close modal when clicking outside the wrapper
    dossierModal.addEventListener('click', (e) => {
        if (e.target === dossierModal) {
            dossierModal.classList.remove('active');
        }
    });

    function closeSidebarMobile() {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('mobile-open');
            sidebarOverlay.classList.remove('active');
        }
    }

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function scrollToBottom() {
        chatFeed.scrollTo({ top: chatFeed.scrollHeight, behavior: 'smooth' });
    }
    
    function checkScrollButton() {
        const isNearBottom = chatFeed.scrollHeight - chatFeed.scrollTop - chatFeed.clientHeight < 100;
        if (isNearBottom) scrollToBottomBtn.classList.remove('visible');
        else scrollToBottomBtn.classList.add('visible');
    }
    chatFeed.addEventListener('scroll', checkScrollButton);
    scrollToBottomBtn.onclick = scrollToBottom;
    
    function saveConversations() {
        localStorage.setItem('sparky_conversations', JSON.stringify(Array.from(conversations.values())));
        localStorage.setItem('sparky_active_id', currentConversationId);
    }

    // --- CYBERPUNK SKELETON LOADERS JS FUNCTION ---
    function showSidebarSkeletons() {
        historyListDiv.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const skel = document.createElement('div');
            skel.className = 'cyber-skeleton history-skeleton';
            skel.style.animationDelay = `${i * 0.1}s`;
            historyListDiv.appendChild(skel);
        }
    }

    // --- SKELETON-ENABLED LOAD CONVERSATIONS ---
    function loadConversations() {
        showSidebarSkeletons();
        
        setTimeout(() => {
            const stored = localStorage.getItem('sparky_conversations');
            if (stored) {
                const parsed = JSON.parse(stored);
                parsed.forEach(c => conversations.set(c.id, c));
            }
            const activeId = localStorage.getItem('sparky_active_id');
            if (activeId && conversations.has(activeId)) currentConversationId = activeId;
            if (!currentConversationId || !conversations.has(currentConversationId)) createNewConversation();
            
            renderHistory();
            renderCurrentChat();
        }, 1500);
    }

    function createNewConversation() {
        const newId = 'sparky_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        conversations.set(newId, { id: newId, title: 'NEW LINK ESTABLISHED', messages: [], createdAt: Date.now() });
        currentConversationId = newId;
        saveConversations();
        renderHistory();
        renderCurrentChat();
        closeSidebarMobile();
        fetch('/api/conversation/new', { method: 'POST', credentials: 'include' }).catch(e => console.error(e));
    }

    function renderCurrentChat() {
        const conv = conversations.get(currentConversationId);
        if (!conv) return;
        
        chatFeed.innerHTML = '';
        
        if (conv.messages.length === 0) {
            chatFeed.insertAdjacentHTML('beforeend', emptyStateHTML);
        } else {
            conv.messages.forEach(msg => {
                if (msg.role === 'user') appendMessageDom('user', msg.content, null);
                else appendMessageDom('ai', msg.content, null, msg.rawHtml);
            });
        }
        scrollToBottom();
    }

    function addCopyButtons(container) {
        container.querySelectorAll('pre').forEach(pre => {
            if (pre.querySelector('.copy-code-btn')) return;
            const btn = document.createElement('button');
            btn.className = 'copy-code-btn';
            btn.textContent = 'COPY';
            btn.onclick = () => {
                const code = pre.querySelector('code');
                navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(() => {
                    btn.textContent = 'COPIED!';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 2000);
                });
            };
            pre.appendChild(btn);
        });
    }

    function appendMessageDom(role, content, attachments = null, customHtml = null) {
        const emptyDisplay = document.getElementById('emptyStateDisplay');
        if(emptyDisplay) emptyDisplay.remove();
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;
        if (role === 'user') {
            msgDiv.innerHTML = `<div class="message-bubble">${DOMPurify.sanitize(content)}</div>`;
        } else {
            if (customHtml) msgDiv.innerHTML = `<div class="message-bubble">${customHtml}</div>`;
            else {
                let parsed = marked.parse(content);
                msgDiv.innerHTML = `<div class="message-bubble">${DOMPurify.sanitize(parsed)}</div>`;
                setTimeout(() => { msgDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block)); addCopyButtons(msgDiv); }, 50);
            }
        }
        chatFeed.appendChild(msgDiv);
        scrollToBottom();
    }

    function addMessageToConv(role, content, attachments = null, rawHtml = null) {
        const conv = conversations.get(currentConversationId);
        if (!conv) return;
        conv.messages.push({ role, content, attachments: null, timestamp: Date.now(), rawHtml });
        if (role === 'user' && conv.messages.filter(m => m.role === 'user').length === 1) {
            let newTitle = content.slice(0, 25) + (content.length > 25 ? '...' : '');
            conv.title = newTitle.toUpperCase();
            saveConversations();
            renderHistory();
        }
        saveConversations();
    }

    function renderHistory() {
        historyListDiv.innerHTML = '';
        const sorted = Array.from(conversations.values()).sort((a,b) => b.createdAt - a.createdAt);
        sorted.forEach(conv => {
            const item = document.createElement('div');
            item.className = `history-item ${conv.id === currentConversationId ? 'active' : ''}`;
            item.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; font-family:'Orbitron', sans-serif; white-space: nowrap;">${conv.title}</span>
                              <button class="delete-conv" data-id="${conv.id}"><i class="fa-solid fa-xmark"></i></button>`;
            item.addEventListener('click', (e) => {
                if (e.target.closest('.delete-conv')) return;
                currentConversationId = conv.id;
                renderCurrentChat();
                renderHistory();
                saveConversations();
                closeSidebarMobile();
            });
            const delBtn = item.querySelector('.delete-conv');
            delBtn.onclick = (e) => {
                e.stopPropagation();
                conversations.delete(conv.id);
                if (currentConversationId === conv.id) createNewConversation();
                renderHistory();
                saveConversations();
                showToast('Link severed');
            };
            historyListDiv.appendChild(item);
        });
    }

    function showThinkingLoader() {
        const emptyDisplay = document.getElementById('emptyStateDisplay');
        if(emptyDisplay) emptyDisplay.remove();
        
        const thinkDiv = document.createElement('div');
        thinkDiv.id = 'thinkLoader';
        thinkDiv.innerHTML = `
            <div class="quantum-thinker">
                <div class="neural-core">
                    <div class="core-ring"></div>
                    <div class="core-ring-reverse"></div>
                    <div class="core-pulse"></div>
                </div>
                <div class="thinking-text">
                    SYSTEM PROCESSING
                    <div class="thinking-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        `;
        chatFeed.appendChild(thinkDiv);
        scrollToBottom();
        return thinkDiv;
    }

    // --- AI SKELETON LOADER JS FUNCTION ---
    function showAISkeletonLoader() {
        const emptyDisplay = document.getElementById('emptyStateDisplay');
        if(emptyDisplay) emptyDisplay.remove();
        
        const skeletonDiv = document.createElement('div');
        skeletonDiv.id = 'aiSkeletonLoader';
        skeletonDiv.className = 'skeleton-message-container message ai-message';
        
        skeletonDiv.innerHTML = `
            <div class="skeleton-bubble message-bubble">
                <div class="cyber-skeleton skeleton-line full"></div>
                <div class="cyber-skeleton skeleton-line full"></div>
                <div class="cyber-skeleton skeleton-line medium"></div>
                <div class="cyber-skeleton skeleton-line short"></div>
            </div>
        `;
        
        chatFeed.appendChild(skeletonDiv);
        scrollToBottom();
        return skeletonDiv;
    }

    async function submitChat() {
        if (isGenerating) return;
        let text = userInput.value.trim();
        if (!text) return;
        isGenerating = true;
        sendBtn.style.display = 'none';
        stopBtn.style.display = 'flex';
        
        appendMessageDom('user', text);
        addMessageToConv('user', text);
        
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        // ACTIVATED SKELETON LOADER HERE
        const thinkLoader = showAISkeletonLoader(); 
        
        try {
            currentAbortController = new AbortController();
            const systemPrompt = "You are Sparky OS, an advanced cyberpunk AI terminal. Be highly intelligent, concise, and professional. Use markdown for formatting.";
            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: currentAbortController.signal,
                credentials: 'include',
                body: JSON.stringify({
                    model: "deepseek-ai/deepseek-v3.2",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }],
                    stream: true
                })
            });
            if (thinkLoader) thinkLoader.remove();
            let fullContent = "";
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerHTML = `<div class="message-bubble"></div>`;
            chatFeed.appendChild(aiDiv);
            const bubble = aiDiv.querySelector('.message-bubble');
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (let line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            fullContent += data.choices[0].delta.content || "";
                            bubble.innerHTML = marked.parse(fullContent);
                            scrollToBottom();
                            setTimeout(() => { bubble.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block)); addCopyButtons(bubble); }, 20);
                        } catch(e) {}
                    }
                }
            }
            addMessageToConv('ai', fullContent);
            speak(fullContent);
        } catch (err) {
            if (thinkLoader) thinkLoader.remove();
            if (err.name !== 'AbortError') {
                appendMessageDom('ai', `⚠️ CONNECTION LOST: ${err.message}. Node offline.`);
                addMessageToConv('ai', `⚠️ CONNECTION LOST: ${err.message}. Node offline.`);
                showToast('System Link Failed');
            }
        } finally {
            sendBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            isGenerating = false;
            sendBtn.disabled = !userInput.value.trim();
        }
    }

    function speak(text) {
        if (!isAudioEnabled) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, ''));
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    // ------------------------- VOICE INPUT FIX (ROBUST) -------------------------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        
        recognition.onstart = () => {
            micBtn.classList.add('recording');
            showToast("Listening...");
        };
        recognition.onresult = (e) => {
            userInput.value += (userInput.value ? " " : "") + e.results[0][0].transcript;
            sendBtn.disabled = false;
        };
        recognition.onerror = (e) => {
            micBtn.classList.remove('recording');
            if (e.error === 'not-allowed') {
                showToast('Mic access denied. Check browser permissions.');
            } else if (e.error === 'no-speech') {
                showToast('No audio detected.');
            } else {
                showToast('Voice Error: ' + e.error);
            }
        };
        recognition.onend = () => {
            micBtn.classList.remove('recording');
        };
        
        micBtn.onclick = () => {
            if (micBtn.classList.contains('recording')) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(err) {
                    recognition.stop();
                }
            }
        };
    } else {
        micBtn.style.opacity = '0.3';
        micBtn.onclick = () => showToast('Voice input is not supported in this browser.');
    }

    voiceToggleBtn.onclick = () => {
        isAudioEnabled = !isAudioEnabled;
        voiceToggleBtn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
        if(!isAudioEnabled) window.speechSynthesis.cancel();
    };

    newChatBtn.onclick = () => createNewConversation();
    
    clearAllBtn.onclick = () => {
        if (confirm('Initiate core wipe? All data will be destroyed.')) {
            conversations.clear();
            createNewConversation();
            renderHistory();
            showToast('Core Purged');
            closeSidebarMobile();
        }
    };

    toggleSidebarBtn.onclick = () => {
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('mobile-open');
            sidebarOverlay.classList.toggle('active');
        } else {
            sidebar.classList.toggle('hidden');
        }
    };

    sidebarOverlay.onclick = closeSidebarMobile;

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight < 150 ? this.scrollHeight : 150) + 'px';
        sendBtn.disabled = (this.value.trim() === '');
    });
    userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChat(); } });
    sendBtn.onclick = (e) => { e.preventDefault(); submitChat(); };
    
    // Updated Stop Button to remove the correct skeleton loader
    stopBtn.onclick = () => { 
        if(currentAbortController) currentAbortController.abort(); 
        const loader = document.getElementById('aiSkeletonLoader') || document.getElementById('thinkLoader'); 
        if(loader) loader.remove(); 
        isGenerating = false; 
        sendBtn.style.display = 'flex'; 
        stopBtn.style.display = 'none'; 
        sendBtn.disabled = !userInput.value.trim(); 
    };
    
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST', credentials: 'include' });
            window.location.href = '/login.html';
        });
    }

    async function addAdminButtonIfNeeded() {
        try {
            const res = await fetch('/api/user', { credentials: 'include' });
            const data = await res.json();
            if (data.user && data.user.role === 'admin') {
                const footer = document.querySelector('.sidebar-footer');
                const adminBtn = document.createElement('button');
                adminBtn.className = 'new-chat-btn';
                adminBtn.id = 'adminDashboardBtn';
                adminBtn.style.background = 'rgba(255,0,85,0.1)';
                adminBtn.style.borderColor = 'var(--accent-pink)';
                adminBtn.style.color = 'var(--accent-pink)';
                adminBtn.style.marginTop = '10px';
                adminBtn.style.backgroundImage = 'none';
                adminBtn.innerHTML = '<i class="fa-solid fa-terminal"></i> SYSTEM ADMIN';
                adminBtn.onclick = () => window.location.href = '/admin.html';
                const existingLogout = document.getElementById('logoutBtn');
                if (existingLogout) footer.insertBefore(adminBtn, existingLogout);
                else footer.appendChild(adminBtn);
            }
        } catch (err) {}
    }
    
    loadConversations();
    sendBtn.disabled = true;
    addAdminButtonIfNeeded();
</script>
</body>
</html>
