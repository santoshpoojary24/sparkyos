<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparky OS | Secure Gateway</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00f0ff;
            --accent: #8a2be2;
            --neon-pink: #ff007f;
            --success: #00ff66;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #eef5ff;
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            transition: opacity 0.6s ease-out;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(138, 43, 226, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.08), transparent 25%);
        }
        
        body.fade-out { opacity: 0; }

        /* --- VISUAL EFFECTS (Cooler & Optimized) --- */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.3;
        }

        .noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 49;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Ambient Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            will-change: transform;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.15); top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: rgba(255, 0, 127, 0.1); bottom: -20%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .parallax-wrapper {
            text-align: center;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            will-change: transform;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            /* Replaced heavy drop-shadow with performant text-shadow */
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            animation: floatUpFade 0.6s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
        }

        .subtitle {
            font-size: clamp(0.7rem, 3vw, 0.8rem);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 60px;
            opacity: 0;
            animation: floatUpFade 0.6s cubic-bezier(0.2, 0.9, 0.4, 1) 0.15s forwards;
        }

        /* --- HARDWARE ACCELERATED BUTTON --- */
        .auth-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 75px;
            opacity: 0;
            animation: floatUpFade 0.6s cubic-bezier(0.2, 0.9, 0.4, 1) 0.3s forwards;
        }

        .hold-btn {
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 25, 0.6); /* Removed heavy backdrop-filter for mobile fps */
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s, background-color 0.3s;
            user-select: none;
            touch-action: none; /* Prevents scroll while holding */
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
            will-change: transform;
        }

        /* Progress Bar Animation - 100% GPU Accelerated */
        .scan-fill {
            position: absolute;
            left: -100%; /* Start outside */
            top: 0; 
            height: 100%; 
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 127, 0.5), var(--neon-pink));
            pointer-events: none;
            transition: transform 0.2s ease-out; /* Fast reset */
            will-change: transform;
        }

        /* When holding */
        .hold-btn.pressing {
            transform: scale(0.95);
            border-color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.05);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.2), inset 0 0 20px rgba(255, 0, 127, 0.1);
        }

        .hold-btn.pressing .scan-fill {
            transform: translateX(100%);
            transition: transform 1s linear; /* 1 second fill duration matching JS */
        }

        .hold-btn i { 
            font-size: 1.4rem; 
            z-index: 2; 
        }
        
        .hold-btn span {
            z-index: 2;
        }

        /* Success State */
        .hold-btn.success { 
            background: rgba(0, 255, 102, 0.1); 
            color: var(--success); 
            border-color: var(--success); 
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .hint-text {
            margin-top: 20px;
            font-size: 0.65rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="parallax-wrapper" id="contentWrapper">
        <div class="logo">SPARKY OS</div>
        <div class="subtitle">Neural Link Interface</div>

        <div class="auth-container">
            <button class="hold-btn" id="holdBtn">
                <div class="scan-fill" id="scanFill"></div>
                <i class="fa-solid fa-fingerprint" id="authIcon"></i>
                <span id="btnText">HOLD TO AUTHORIZE</span>
            </button>
            <div class="hint-text" id="hintText">Encryption Handshake Required</div>
        </div>
    </div>

    <script>
        const contentWrapper = document.getElementById('contentWrapper');
        const holdBtn = document.getElementById('holdBtn');
        const btnText = document.getElementById('btnText');
        const authIcon = document.getElementById('authIcon');
        const hintText = document.getElementById('hintText');

        // ------------------------- SMOOTH PARALLAX (Only applied to light elements) -------------------------
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        function updateParallax() {
            // Lerping for butter-smooth easing
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;
            
            // Only transform the wrapper, separating it from the heavy background
            contentWrapper.style.transform = `translate3d(${currentX * 10}px, ${currentY * 10}px, 0) rotateY(${currentX * 5}deg) rotateX(${-currentY * 5}deg)`;
            
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        // Mouse support
        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth - 0.5);
            targetY = (e.clientY / window.innerHeight - 0.5);
        });

        // Mobile Gyroscope support (Optimized)
        window.addEventListener('deviceorientation', (e) => {
            if(e.gamma) {
                // Clamp values to prevent crazy flipping
                let gamma = Math.max(-45, Math.min(45, e.gamma));
                let beta = Math.max(-45, Math.min(45, e.beta));
                targetX = gamma / 45;
                targetY = beta / 45;
            }
        });

        // ------------------------- CSS-DRIVEN ANIMATED LOGIC -------------------------
        // By relying on CSS transitions for the visual fill, we save immense CPU power on mobile.
        
        let holdTimeout;
        const holdDuration = 1000; // 1 second
        let isAuthorized = false;

        function startScan(e) {
            if (isAuthorized) return;
            if (e.cancelable) e.preventDefault();
            
            // Add class -> triggers CSS transform translateX(100%) which takes exactly 1s
            holdBtn.classList.add('pressing');
            btnText.innerText = "LINKING...";
            authIcon.className = "fa-solid fa-circle-notch fa-spin";
            hintText.innerText = "Reading Neural Patterns...";
            hintText.style.color = "var(--neon-pink)";

            if (navigator.vibrate) navigator.vibrate(50); // Small tactile click

            // Wait for 1 second to see if they held it long enough
            holdTimeout = setTimeout(completeAuth, holdDuration);
        }

        function cancelScan() {
            if (isAuthorized) return;
            
            clearTimeout(holdTimeout); // Cancel the success trigger
            
            // Remove class -> CSS transition snaps it back smoothly
            holdBtn.classList.remove('pressing');
            btnText.innerText = "HOLD TO AUTHORIZE";
            authIcon.className = "fa-solid fa-fingerprint";
            hintText.innerText = "Encryption Handshake Required";
            hintText.style.color = "#475569";
        }

        function completeAuth() {
            isAuthorized = true;
            
            holdBtn.classList.remove('pressing');
            holdBtn.classList.add('success');
            
            btnText.innerText = "ACCESS GRANTED";
            authIcon.className = "fa-solid fa-shield-check";
            hintText.innerText = "Welcome back, Operator.";
            hintText.style.color = "var(--success)";

            if (navigator.vibrate) navigator.vibrate([50, 30, 100]); // Success vibration

            // Smooth exit
            setTimeout(() => {
                document.body.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = 'login.html'; // Adjust this URL
                }, 600);
            }, 1000);
        }

        // Event Listeners for Desktop & Mobile
        holdBtn.addEventListener('mousedown', startScan);
        window.addEventListener('mouseup', cancelScan);
        holdBtn.addEventListener('mouseleave', cancelScan);
        
        holdBtn.addEventListener('touchstart', startScan, {passive: false});
        holdBtn.addEventListener('touchend', cancelScan);
        holdBtn.addEventListener('touchcancel', cancelScan);
    </script>
<script type="module">
    import { injectSpeedInsights } from '/_vercel/speed-insights/script.js';
    injectSpeedInsights();
</script>
</body>
</html>
