<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparky OS | Secure Gateway</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #3b82f6;
            --accent: #a855f7;
            --neon-pink: #ec489a;
            --success: #4ade80;
            --bg-dark: #020408;
        }

        body {
            background-color: var(--bg-dark);
            color: #eef5ff;
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            transition: opacity 0.6s ease-out;
        }
        
        body.fade-out { opacity: 0; }

        /* --- SMOOTH BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            z-index: -1;
            will-change: transform; /* Optimization for mobile */
        }

        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .parallax-wrapper {
            text-align: center;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            will-change: transform;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
            animation: floatUpFade 0.8s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
        }

        .subtitle {
            font-size: clamp(0.7rem, 3vw, 0.8rem);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 60px;
            opacity: 0;
            animation: floatUpFade 0.8s cubic-bezier(0.2, 0.9, 0.4, 1) 0.2s forwards;
        }

        /* --- SIMULATED SCAN BUTTON --- */
        .auth-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 80px;
            opacity: 0;
            animation: floatUpFade 0.8s cubic-bezier(0.2, 0.9, 0.4, 1) 0.4s forwards;
        }

        .hold-btn {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            user-select: none;
            touch-action: none;
        }

        .hold-btn.pressing {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--neon-pink);
        }

        /* Progress Bar Animation */
        .scan-fill {
            position: absolute;
            left: 0; top: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, var(--neon-pink));
            opacity: 0.6;
            pointer-events: none;
            transition: width 0.1s linear;
        }

        .hold-btn i { font-size: 1.4rem; transition: 0.3s; }

        /* States */
        .hold-btn.success { 
            background: var(--success); 
            color: #000; 
            border-color: var(--success); 
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.4);
        }

        .hint-text {
            margin-top: 20px;
            font-size: 0.65rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="bg-layer" id="bgLayer"></div>

    <div class="parallax-wrapper" id="contentWrapper">
        <div class="logo">SPARKY OS</div>
        <div class="subtitle">Neural Link Interface</div>

        <div class="auth-container">
            <button class="hold-btn" id="holdBtn">
                <div class="scan-fill" id="scanFill"></div>
                <i class="fa-solid fa-fingerprint" id="authIcon"></i>
                <span id="btnText">HOLD TO AUTHORIZE</span>
            </button>
            <div class="hint-text" id="hintText">Encryption Handshake Required</div>
        </div>
    </div>

    <script>
        const bgLayer = document.getElementById('bgLayer');
        const contentWrapper = document.getElementById('contentWrapper');
        const holdBtn = document.getElementById('holdBtn');
        const scanFill = document.getElementById('scanFill');
        const btnText = document.getElementById('btnText');
        const authIcon = document.getElementById('authIcon');
        const hintText = document.getElementById('hintText');

        // ------------------------- SMOOTH PARALLAX (Performance Optimized) -------------------------
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        function updateParallax() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            
            bgLayer.style.transform = `translate(${currentX * 20}px, ${currentY * 20}px)`;
            contentWrapper.style.transform = `rotateY(${currentX * 10}deg) rotateX(${-currentY * 10}deg)`;
            
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX / window.innerWidth - 0.5);
            targetY = (e.clientY / window.innerHeight - 0.5);
        });

        window.addEventListener('deviceorientation', (e) => {
            if(e.gamma) {
                targetX = e.gamma / 45;
                targetY = e.beta / 45;
            }
        });

        // ------------------------- ANIMATED HOLD LOGIC (Visual Only) -------------------------
        let holdTimer;
        let progress = 0;
        const holdDuration = 1000; // 1 second hold
        let isAuthorized = false;

        function startScan(e) {
            if (isAuthorized) return;
            if (e.cancelable) e.preventDefault();
            
            progress = 0;
            holdBtn.classList.add('pressing');
            btnText.innerText = "LINKING...";
            authIcon.className = "fa-solid fa-circle-notch fa-spin";
            hintText.innerText = "Reading Neural Patterns...";

            const startTime = Date.now();
            holdTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / holdDuration) * 100;
                
                if (progress >= 100) {
                    clearInterval(holdTimer);
                    completeAuth();
                } else {
                    scanFill.style.width = progress + "%";
                }
            }, 16);
        }

        function cancelScan() {
            if (isAuthorized) return;
            clearInterval(holdTimer);
            holdBtn.classList.remove('pressing');
            scanFill.style.width = "0%";
            btnText.innerText = "HOLD TO AUTHORIZE";
            authIcon.className = "fa-solid fa-fingerprint";
            hintText.innerText = "Encryption Handshake Required";
        }

        function completeAuth() {
            isAuthorized = true;
            scanFill.style.width = "100%";
            holdBtn.classList.remove('pressing');
            holdBtn.classList.add('success');
            
            btnText.innerText = "ACCESS GRANTED";
            authIcon.className = "fa-solid fa-shield-check";
            hintText.innerText = "Welcome back, Operator.";
            hintText.style.color = "var(--success)";

            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);

            // Smooth exit
            setTimeout(() => {
                document.body.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = 'login.html'; // Adjust this URL
                }, 600);
            }, 1000);
        }

        // Event Listeners
        holdBtn.addEventListener('mousedown', startScan);
        window.addEventListener('mouseup', cancelScan);
        
        holdBtn.addEventListener('touchstart', startScan, {passive: false});
        holdBtn.addEventListener('touchend', cancelScan);
    </script>
</body>
</html>
