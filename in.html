<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparky OS | Secure Gateway</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #3b82f6;
            --accent: #a855f7;
            --neon-pink: #ec489a;
            --danger: #ef4444;
            --warning: #fbbf24;
            --bg-dark: #020408;
        }

        body {
            background-color: var(--bg-dark);
            color: #eef5ff;
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            transition: opacity 0.6s ease-out;
        }
        
        body.fade-out {
            opacity: 0;
        }

        /* --- FLOWMOTION LIQUID BACKGROUND --- */
        .bg-layer {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(236, 72, 154, 0.1) 0%, transparent 40%);
            z-index: -1;
            transition: transform 0.1s ease-out;
        }

        /* --- ENTRANCE ANIMATIONS --- */
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .parallax-wrapper {
            text-align: center;
            transition: transform 0.1s ease-out;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
            opacity: 0;
            animation: floatUpFade 1s cubic-bezier(0.2, 0.9, 0.4, 1.1) 0.1s forwards;
        }

        .subtitle {
            font-size: clamp(0.7rem, 3vw, 0.9rem);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 60px;
            opacity: 0;
            animation: floatUpFade 1s cubic-bezier(0.2, 0.9, 0.4, 1.1) 0.3s forwards;
        }

        /* --- BIOMETRIC HOLD BUTTON --- */
        .auth-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 80px;
            opacity: 0;
            animation: floatUpFade 1s cubic-bezier(0.2, 0.9, 0.4, 1.1) 0.5s forwards;
        }

        .hold-btn {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.85rem, 4vw, 1rem);
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), background 0.3s, border-color 0.3s, color 0.3s;
            backdrop-filter: blur(10px);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            will-change: transform;
        }

        .hold-btn.pressing {
            transform: scale(0.94);
            box-shadow: inset 0 0 20px rgba(236, 72, 154, 0.2), 0 5px 15px rgba(0,0,0,0.6);
            background: rgba(255, 255, 255, 0.06);
        }

        .scan-fill {
            position: absolute;
            left: 0; top: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, transparent, rgba(236, 72, 154, 0.4), var(--neon-pink));
            box-shadow: 2px 0 15px var(--neon-pink);
            transition: width 0.1s linear;
            pointer-events: none;
        }

        .hold-btn i { font-size: 1.3rem; transition: 0.3s; }

        .hold-btn.scanning { border-color: var(--neon-pink); color: #fff; }
        .hold-btn.success { background: var(--primary); color: #fff; border-color: #fff; transform: scale(1.05); box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
        .hold-btn.error-state { border-color: var(--danger); color: var(--danger); background: rgba(239, 68, 68, 0.1); transform: scale(1); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        .hint-text {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: opacity 0.3s, color 0.3s;
        }

        .hold-btn.pressing ~ .hint-text { opacity: 0.3; }

    </style>
</head>
<body>

    <div class="bg-layer" id="bgLayer"></div>

    <div class="parallax-wrapper" id="contentWrapper">
        <div class="logo">SPARKY OS</div>
        <div class="subtitle">Neural Link Interface</div>

        <div class="auth-container">
            <button class="hold-btn" id="holdBtn">
                <div class="scan-fill" id="scanFill"></div>
                <i class="fa-solid fa-fingerprint" id="authIcon"></i>
                <span id="btnText">HOLD TO AUTHORIZE</span>
            </button>
            <div class="hint-text" id="hintText">Hardware Biometric Required</div>
        </div>
    </div>

    <script>
        const bgLayer = document.getElementById('bgLayer');
        const contentWrapper = document.getElementById('contentWrapper');
        const holdBtn = document.getElementById('holdBtn');
        const scanFill = document.getElementById('scanFill');
        const btnText = document.getElementById('btnText');
        const authIcon = document.getElementById('authIcon');
        const hintText = document.getElementById('hintText');

        // ------------------------- GYROSCOPE PARALLAX -------------------------
        function initGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => { if (response == 'granted') window.addEventListener('deviceorientation', handleOrientation); })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            const x = event.gamma ? event.gamma / 20 : 0; 
            const y = event.beta ? event.beta / 20 : 0;
            bgLayer.style.transform = `translate(${x * 15}px, ${y * 15}px)`;
            contentWrapper.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
        }

        document.body.addEventListener('touchstart', initGyro, { once: true });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            bgLayer.style.transform = `translate(${x * -1}px, ${y * -1}px)`;
            contentWrapper.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        // ------------------------- HOLD & HARDWARE WEBAUTHN LOGIC -------------------------
        let holdTimer;
        let progress = 0;
        const holdDuration = 1200; // 1.2 seconds to fill bar
        let isProcessing = false;

        function startScan(e) {
            if(e.type === 'touchstart') e.preventDefault(); 
            if(isProcessing) return;
            
            holdBtn.classList.remove('error-state');
            holdBtn.classList.add('scanning', 'pressing');
            btnText.innerText = "SCANNING...";
            authIcon.className = "fa-solid fa-compact-disc fa-spin";
            hintText.innerText = "Initializing Hardware...";
            hintText.style.color = "#475569";
            
            const startTime = Date.now();
            holdTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / holdDuration) * 100;
                
                if (progress >= 100) {
                    clearInterval(holdTimer);
                    triggerHardwareBiometrics();
                } else {
                    scanFill.style.width = progress + "%";
                }
            }, 20);
        }

        function cancelScan() {
            if(isProcessing) return;
            clearInterval(holdTimer);
            holdBtn.classList.remove('pressing'); 
            
            if (progress < 100) {
                holdBtn.classList.remove('scanning');
                scanFill.style.width = "0%";
                btnText.innerText = "HOLD TO AUTHORIZE";
                authIcon.className = "fa-solid fa-fingerprint";
                hintText.innerText = "Hardware Biometric Required";
                progress = 0;
            }
        }

        async function triggerHardwareBiometrics() {
            isProcessing = true;
            holdBtn.classList.remove('scanning', 'pressing');
            scanFill.style.width = "100%";
            btnText.innerText = "AWAITING SENSOR...";
            authIcon.className = "fa-solid fa-microchip fa-fade";
            hintText.innerText = "Please verify using FaceID / Fingerprint / PIN";
            hintText.style.color = "var(--primary)";
            
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            try {
                // 1. Check if browser supports WebAuthn
                if (!window.PublicKeyCredential) {
                    throw new Error("Biometrics not supported on this device.");
                }

                // 2. Generate cryptographically secure random bytes for a mock challenge
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                // 3. WebAuthn Configuration
                const publicKey = {
                    challenge: challenge,
                    rp: { name: "Sparky OS Neural Link", id: window.location.hostname },
                    user: {
                        id: userId,
                        name: "operator_01",
                        displayName: "Sparky Operator"
                    },
                    pubKeyCredParams: [
                        { type: "public-key", alg: -7 },   // ES256
                        { type: "public-key", alg: -257 }  // RS256
                    ],
                    authenticatorSelection: {
                        authenticatorAttachment: "platform", // Forces built-in device biometrics
                        userVerification: "required"         // Forces successful biometric read
                    },
                    timeout: 60000,
                    attestation: "none"
                };

                // 4. TRIGGER NATIVE OS PROMPT (This opens FaceID/Hello/TouchID)
                const credential = await navigator.credentials.create({ publicKey });

                // 5. IF SUCCESSFUL: Proceed to Login
                holdBtn.classList.add('success');
                btnText.innerText = "BIOMETRIC VERIFIED";
                authIcon.className = "fa-solid fa-check-double";
                hintText.innerText = "Tunnel Secure. Redirecting...";
                hintText.style.color = "#4ade80";

                setTimeout(() => {
                    document.body.classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 600);
                }, 800);

            } catch (err) {
                // 6. IF FAILED / CANCELLED / NOT SUPPORTED -> DEV OVERRIDE
                console.warn("Biometric Error:", err);
                
                // Visual Error State Initial
                scanFill.style.width = "0%";
                holdBtn.classList.add('error-state');
                btnText.innerText = "VERIFICATION FAILED";
                authIcon.className = "fa-solid fa-triangle-exclamation";
                
                if (err.name === "NotAllowedError") {
                    hintText.innerText = "Biometric prompt cancelled.";
                } else {
                    hintText.innerText = "Hardware module missing. Initiating override...";
                }
                hintText.style.color = "var(--danger)";

                // --- EMERGENCY DEV OVERRIDE ---
                // Wait 1.5 seconds so the user sees the error, then bypass it.
                setTimeout(() => {
                    holdBtn.classList.remove('error-state');
                    holdBtn.classList.add('success');
                    holdBtn.style.backgroundColor = "rgba(251, 191, 36, 0.2)"; // Warning Yellow
                    holdBtn.style.borderColor = "var(--warning)";
                    holdBtn.style.boxShadow = "0 0 40px rgba(251, 191, 36, 0.5)";
                    
                    btnText.innerText = "DEV OVERRIDE ACTIVE";
                    authIcon.className = "fa-solid fa-unlock-keyhole";
                    hintText.innerText = "Bypassing security gate...";
                    hintText.style.color = "var(--warning)";

                    setTimeout(() => {
                        document.body.classList.add('fade-out');
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 600);
                    }, 1000);
                }, 1500);
            }
        }

        // Event Listeners
        holdBtn.addEventListener('mousedown', startScan);
        holdBtn.addEventListener('mouseup', cancelScan);
        holdBtn.addEventListener('mouseleave', cancelScan);
        
        holdBtn.addEventListener('touchstart', startScan);
        holdBtn.addEventListener('touchend', cancelScan);
        holdBtn.addEventListener('touchcancel', cancelScan);

    </script>
</body>
</html>
