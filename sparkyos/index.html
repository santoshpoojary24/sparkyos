<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sparky OS | Neural Link</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Unified Cyberpunk Variables */
            --bg-deep: #020408;
            --glass-bg: rgba(10, 15, 30, 0.7);
            --sidebar-glass: rgba(10, 15, 30, 0.85);
            --glass-border: rgba(59, 130, 246, 0.3);
            --text-main: #eef5ff;
            --text-muted: #a0b3d9;
            --msg-ai: rgba(15, 25, 45, 0.8);
            --accent-glow: #3b82f6;
            --accent-secondary: #a855f7;
            --accent-pink: #ec489a;
            --msg-user: linear-gradient(135deg, var(--accent-glow), var(--accent-secondary));
            --shadow-float: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.05);
            --code-bg: #0d1117;
            --code-text: #e2e8f0;
            --hover-bg: rgba(59,130,246,0.15);
            --blur-intensity: blur(20px);
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                           radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
            --loader-glow: #3b82f6;
        }

        [data-theme="aurora"] {
            --bg-deep: #f0f4fa;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --sidebar-glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(100, 100, 255, 0.3);
            --text-main: #1e293b;
            --text-muted: #475569;
            --msg-ai: rgba(255, 255, 255, 0.9);
            --accent-glow: #3b82f6;
            --accent-secondary: #8b5cf6;
            --msg-user: linear-gradient(125deg, #3b82f6, #8b5cf6);
            --shadow-float: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            --code-bg: #f1f5f9;
            --code-text: #0f172a;
            --hover-bg: rgba(0, 0, 0, 0.05);
            --bg-gradient: radial-gradient(circle at 20% 30%, #e0e7ff, #cbd5e1);
            --loader-glow: #4f46e5;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100dvh; /* CRITICAL FIX: Accounts for mobile browser bars */
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: default;
            transition: background 0.3s ease;
        }

        /* Touch optimization for buttons and links */
        button, a, .history-item {
            touch-action: manipulation; 
        }

        /* Animated background orb */
        .mouse-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(139,92,246,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(50px);
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .anti-gravity-app {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        /* SIDEBAR */
        .glass-sidebar {
            width: 280px;
            flex-shrink: 0;
            background: var(--sidebar-glass);
            backdrop-filter: var(--blur-intensity);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), margin 0.4s ease;
            z-index: 40;
            box-shadow: 12px 0 40px rgba(0,0,0,0.4);
        }

        /* Desktop hidden state */
        .glass-sidebar.hidden {
            margin-left: -280px;
        }

        /* Mobile Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 35;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* Logo Section - Admin Dashboard Style */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .logo-main {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-pink);
            letter-spacing: 3px;
            text-transform: uppercase;
            background: rgba(236, 72, 154, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(236, 72, 154, 0.3);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--accent-glow);
            transition: all 0.3s;
            margin-bottom: 24px;
        }
        @media (hover: hover) {
            .new-chat-btn:hover {
                background: rgba(59, 130, 246, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
                color: #fff;
            }
        }
        .new-chat-btn:active {
            transform: translateY(1px);
            background: rgba(59, 130, 246, 0.3);
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-history-list::-webkit-scrollbar { display: none; }
        
        .history-item {
            padding: 12px 16px;
            border-radius: 12px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item.active {
            border-color: var(--accent-glow);
            background: rgba(59,130,246,0.1);
            color: var(--accent-glow);
            box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.1);
        }
        @media (hover: hover) {
            .history-item:hover {
                background: var(--hover-bg);
                color: var(--text-main);
            }
        }
        .history-item:active {
            background: var(--hover-bg);
        }
        
        .delete-conv {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
            padding: 4px; 
        }
        .history-item:hover .delete-conv, .history-item:active .delete-conv { opacity: 1; }
        @media (max-width: 768px) {
            .delete-conv { opacity: 1; }
        }

        .sidebar-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        @media (hover: hover) {
            .social-link:hover { color: var(--accent-glow); transform: translateX(4px); }
        }

        /* CHAT WORKSPACE */
        .chat-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0; 
        }
        .workspace-header {
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }
        .tool-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            width: 44px; 
            height: 44px; 
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        @media (hover: hover) {
            .tool-btn:hover {
                color: var(--accent-glow);
                border-color: var(--accent-glow);
                box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
                transform: translateY(-2px);
            }
        }
        .tool-btn:active {
            transform: translateY(1px);
            background: rgba(59, 130, 246, 0.1);
        }

        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px 28px 140px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        /* Antigravity scroll effect */
        .message {
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.3s;
            will-change: transform;
        }
        @media (hover: hover) {
            .message:hover {
                transform: translateY(-3px) scale(1.01);
            }
        }

        .chat-feed::-webkit-scrollbar { width: 5px; }
        .chat-feed::-webkit-scrollbar-track { background: transparent; }
        .chat-feed::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.5); border-radius: 10px; }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: floatIn 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .user-message { align-self: flex-end; }
        .ai-message { align-self: flex-start; }
        .message-bubble {
            padding: 16px 24px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
            box-shadow: var(--shadow-float);
            backdrop-filter: blur(12px);
            border: 1px solid transparent;
            word-wrap: break-word; 
        }
        .user-message .message-bubble {
            background: var(--msg-user);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-message .message-bubble {
            background: var(--msg-ai);
            border-color: var(--glass-border);
            border-bottom-left-radius: 4px;
        }
        .ai-message pre { 
            background: var(--code-bg); 
            padding: 16px; 
            border-radius: 12px; 
            overflow-x: auto; 
            margin: 12px 0; 
            border: 1px solid var(--glass-border); 
            -webkit-overflow-scrolling: touch; 
        }
        .ai-message code { font-family: 'Courier New', Courier, monospace; font-size: 0.9em; background: var(--code-bg); padding: 2px 6px; border-radius: 6px; color: var(--code-text); }
        .ai-message pre code { background: transparent; padding: 0; }

        /* QUANTUM CORE PULSE LOADER */
        .quantum-thinker {
            display: flex;
            align-items: center;
            gap: 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 12px 28px;
            width: fit-content;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 20px rgba(59,130,246,0.15);
        }
        .neural-core { position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
        .core-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid transparent; border-top: 3px solid var(--accent-glow); border-right: 2px solid rgba(139,92,246,0.6); animation: spinRing 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }
        .core-ring-reverse { position: absolute; width: 80%; height: 80%; border-radius: 50%; border: 2px solid transparent; border-bottom: 2px solid var(--accent-secondary); border-left: 2px solid rgba(59,130,246,0.5); animation: spinRingReverse 1.6s linear infinite; }
        .core-pulse { width: 14px; height: 14px; background: radial-gradient(circle, var(--accent-glow), var(--accent-secondary)); border-radius: 50%; animation: quantumPulse 1.2s ease-in-out infinite; box-shadow: 0 0 16px var(--accent-glow); z-index: 2; }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinRingReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes quantumPulse { 0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 0 0 rgba(59,130,246,0.7); } 50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 0 8px rgba(59,130,246,0); } }
        .thinking-text { font-weight: 700; letter-spacing: 2px; background: linear-gradient(120deg, var(--text-main), var(--accent-glow)); -webkit-background-clip: text; color: transparent; font-size: 0.8rem; text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
        .thinking-dots { display: inline-flex; gap: 4px; margin-left: 4px; }
        .thinking-dots span { width: 6px; height: 6px; background: var(--accent-glow); border-radius: 50%; animation: dotBlink 1.2s infinite; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBlink { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

        /* INPUT ZONE */
        .input-zone {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 28px 28px;
            background: linear-gradient(to top, var(--bg-deep) 60%, transparent);
            z-index: 100; /* CRITICAL FIX: Increased z-index */
        }
        .floating-input-form {
            max-width: 850px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 12px 16px;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .floating-input-form:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        .input-row { display: flex; gap: 12px; align-items: flex-end; }
        
        .prompt-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            padding: 12px 8px;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }
        .prompt-input::placeholder { color: var(--text-muted); }
        
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.3rem;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            width: 44px; height: 44px; 
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        @media (hover: hover) {
            .action-btn:hover { color: var(--accent-glow); background: rgba(59,130,246,0.1); }
        }
        .recording { color: var(--accent-pink) !important; animation: pulse-pink 1s infinite; }
        @keyframes pulse-pink { 50% { opacity: 0.5; box-shadow: 0 0 15px var(--accent-pink); } }

        .send-action {
            background: var(--accent-glow);
            color: white;
            border: none;
            border-radius: 12px;
            width: 44px; height: 44px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        @media (hover: hover) {
            .send-action:hover:not(:disabled) { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); transform: translateY(-2px); }
        }
        .send-action:active:not(:disabled) { transform: translateY(1px); }
        .send-action:disabled { background: var(--text-muted); opacity: 0.5; cursor: not-allowed; }
        
        .stop-action {
            background: transparent;
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
            border-radius: 12px;
            width: 44px; height: 44px;
            justify-content: center; align-items: center;
            display: none;
            transition: 0.3s;
            flex-shrink: 0;
        }
        @media (hover: hover) {
            .stop-action:hover { background: rgba(236, 72, 154, 0.1); box-shadow: 0 0 10px rgba(236, 72, 154, 0.3); }
        }

        .toast-msg {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; padding: 10px 20px; border-radius: 12px; z-index: 1000;
            font-size: 0.8rem; font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
            white-space: nowrap;
        }

        .scroll-to-bottom {
            position: fixed; bottom: 110px; right: 28px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 50; transition: 0.3s;
            opacity: 0; transform: scale(0.9); pointer-events: none;
            color: var(--text-main);
        }
        .scroll-to-bottom.visible { opacity: 1; transform: scale(1); pointer-events: auto; }
        @media (hover: hover) {
            .scroll-to-bottom:hover { color: var(--accent-glow); border-color: var(--accent-glow); box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        }
        
        /* INTRODUCTION SECTION STYLES - ADDED */
        .system-intro {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 8px;
            backdrop-filter: blur(15px);
            max-width: 800px;
            align-self: center;
            box-shadow: var(--shadow-float);
            width: 100%;
        }
        .system-intro h2 { font-family: 'Orbitron'; color: var(--accent-glow); margin-bottom: 15px; font-size: 1.3rem; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .system-intro h3 { font-family: 'Orbitron'; color: var(--accent-pink); margin-top: 20px; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .system-intro p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
        .system-intro ul { list-style: none; padding-left: 5px; }
        .system-intro ul li { font-size: 0.9rem; margin-bottom: 10px; color: var(--text-main); display: flex; align-items: flex-start; gap: 10px; }
        .system-intro ul li i { color: var(--accent-glow); margin-top: 4px; font-size: 0.8rem; }
        .system-intro strong { color: var(--text-main); }
        
        /* RESPONSIVE & MOBILE SPECIFIC RULES */
        @media (max-width: 768px) {
            .glass-sidebar { 
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: 80%;
                max-width: 320px;
                transform: translateX(-100%);
                border-right: none;
                margin-left: 0 !important; 
            }
            .glass-sidebar.mobile-open {
                transform: translateX(0);
            }
            .workspace-header {
                padding: 12px 16px;
            }
            .chat-feed {
                padding: 12px 16px 120px;
            }
            .message { 
                max-width: 95%; 
            }
            .message-bubble {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            .input-zone {
                padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); 
            }
            .floating-input-form {
                padding: 8px 12px;
                border-radius: 20px;
            }
            .input-row { gap: 8px; }
            .prompt-input {
                padding: 10px 8px;
                font-size: 16px !important; 
            }
            .scroll-to-bottom {
                bottom: 95px; right: 16px;
            }
            .quantum-thinker {
                padding: 10px 20px;
                gap: 12px;
            }
            .thinking-text { font-size: 0.7rem; }
            .system-intro {
                padding: 18px;
                margin: 0 4px 12px 4px;
            }
        }
    </style>
</head>
<body data-theme="dark">
<script>
    // ========== AUTHENTICATION CHECK ==========
    (async () => {
        try {
            const res = await fetch('/api/check-auth', { credentials: 'include' });
            if (!res.ok) window.location.href = '/login.html';
        } catch (err) {
            // Uncomment in production: window.location.href = '/login.html';
        }
    })();
</script>
<div class="mouse-orb" id="mouseOrb"></div>
<div class="anti-gravity-app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <nav class="glass-sidebar" id="sidebar">
        <div class="logo-section">
            <div class="logo-main"><i class="fa-solid fa-atom"></i> SPARKY</div>
            <div class="logo-sub">OS NEURAL LINK</div>
        </div>
        
        <button class="new-chat-btn" id="newChatBtn"><i class="fa-solid fa-network-wired"></i> INITIALIZE LINK</button>
        <div class="chat-history-list" id="historyList"></div>
        <div class="sidebar-footer">
            <button class="new-chat-btn" id="clearAllBtn" style="border-color: rgba(236,72,154,0.5); color: var(--accent-pink); background: rgba(236,72,154,0.05);"><i class="fa-solid fa-radiation"></i> PURGE DATA</button>
            <button class="new-chat-btn" id="logoutBtn" style="color: var(--text-muted); border-color: transparent;"><i class="fa-solid fa-power-off"></i> DE-AUTHORIZE</button>
            <a href="mailto:santoshpoojary2004@gmail.com" class="social-link" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-envelope"></i> System Support</a>
            <a href="https://www.instagram.com/xxiv.sparky?igsh=MXRteGR2enZ4bHhqcw%3D%3D&utm_source=qr" class="social-link" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i> @xxiv.sparky</a>
        </div>
    </nav>

    <main class="chat-workspace">
        <header class="workspace-header">
            <button class="tool-btn" id="toggleSidebar"><i class="fa-solid fa-bars-staggered"></i></button>
            <div class="header-tools" style="display: flex; gap: 12px;">
                <button class="tool-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
                <button class="tool-btn" id="voiceToggleBtn"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </header>

        <div class="chat-feed" id="chatFeed"></div>
        <div class="scroll-to-bottom" id="scrollToBottom"><i class="fa-solid fa-chevron-down"></i></div>

        <footer class="input-zone">
            <div class="floating-input-form" id="inputFormContainer">
                <div class="input-row">
                    <button type="button" class="action-btn" id="micBtn"><i class="fa-solid fa-microphone"></i></button>
                    <textarea class="prompt-input" id="userInput" placeholder="Ask Sparky Anything..." rows="1"></textarea>
                    <button type="submit" class="send-action" id="sendBtn" disabled><i class="fa-solid fa-paper-plane"></i></button>
                    <button type="button" class="stop-action" id="stopBtn"><i class="fa-solid fa-stop"></i></button>
                </div>
            </div>
        </footer>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    // ------------------------- Antigravity Mouse Effect -------------------------
    const orb = document.getElementById('mouseOrb');
    document.addEventListener('mousemove', (e) => {
        if(window.innerWidth > 768) {
            const x = e.clientX;
            const y = e.clientY;
            orb.style.transform = `translate(${x - 150}px, ${y - 150}px)`;
        }
    });
    
    // ------------------------- Global State -------------------------
    const SERVER_URL = "/api/chat";
    let currentAbortController = null;
    let isAudioEnabled = true;
    let currentConversationId = null;
    let conversations = new Map();
    let isGenerating = false;

    const chatFeed = document.getElementById('chatFeed');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const micBtn = document.getElementById('micBtn');
    const voiceToggleBtn = document.getElementById('voiceToggleBtn');
    const themeBtn = document.getElementById('themeBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyListDiv = document.getElementById('historyList');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const toggleSidebarBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const scrollToBottomBtn = document.getElementById('scrollToBottom');

    // Helper: Intro HTML block (static, used for empty conversations)
    const introHTML = `
        <div class="system-intro">
            <h2><i class="fa-solid fa-terminal"></i> SYSTEM BRIEFING: SPARKY OS</h2>
            <h3><i class="fa-solid fa-user-gear"></i> THE ARCHITECT</h3>
            <p>Designed and engineered by <strong>Santosh Poojary</strong>. This interface is built to bridge the gap between human creativity and synthetic intelligence through a high-performance terminal environment.</p>
            <h3><i class="fa-solid fa-microchip"></i> PROJECT OBJECTIVE</h3>
            <p>Sparky OS is a sophisticated <strong>Neural Link Assistant</strong>. Unlike standard chat interfaces, this project focuses on a tactical, distraction-free environment optimized for real-time problem solving, code generation, and complex data synthesis.</p>
            <h3><i class="fa-solid fa-rocket"></i> CORE UTILITIES</h3>
            <ul>
                <li><i class="fa-solid fa-shield-halved"></i> <strong>Secure Link:</strong> Encrypted communication nodes with built-in data purge protocols.</li>
                <li><i class="fa-solid fa-bolt-lightning"></i> <strong>Low Latency:</strong> Powered by DeepSeek-V3 for rapid, intelligent response streaming.</li>
                <li><i class="fa-solid fa-wand-magic-sparkles"></i> <strong>Adaptive UI:</strong> A glass-morphic design that responds to both desktop precision and mobile touch interaction.</li>
            </ul>
        </div>
    `;

    function closeSidebarMobile() {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('mobile-open');
            sidebarOverlay.classList.remove('active');
        }
    }

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function scrollToBottom() {
        chatFeed.scrollTo({ top: chatFeed.scrollHeight, behavior: 'smooth' });
    }
    
    function checkScrollButton() {
        const isNearBottom = chatFeed.scrollHeight - chatFeed.scrollTop - chatFeed.clientHeight < 100;
        if (isNearBottom) scrollToBottomBtn.classList.remove('visible');
        else scrollToBottomBtn.classList.add('visible');
    }
    chatFeed.addEventListener('scroll', checkScrollButton);
    scrollToBottomBtn.onclick = scrollToBottom;

    function applyAntigravityEffect() {
        if(window.innerWidth <= 768) {
            document.querySelectorAll('.message').forEach(msg => msg.style.transform = 'none');
            return;
        }
        const messages = document.querySelectorAll('.message');
        const viewportHeight = window.innerHeight;
        messages.forEach(msg => {
            const rect = msg.getBoundingClientRect();
            const centerY = rect.top + rect.height / 2;
            const distanceFromCenter = (centerY - viewportHeight / 2) / viewportHeight;
            const shiftY = Math.min(Math.max(distanceFromCenter * -12, -8), 8);
            msg.style.transform = `translateY(${shiftY}px)`;
        });
    }
    chatFeed.addEventListener('scroll', () => requestAnimationFrame(applyAntigravityEffect));
    window.addEventListener('resize', () => applyAntigravityEffect());
    
    // Storage
    function saveConversations() {
        localStorage.setItem('sparky_conversations', JSON.stringify(Array.from(conversations.values())));
        localStorage.setItem('sparky_active_id', currentConversationId);
    }

    function loadConversations() {
        const stored = localStorage.getItem('sparky_conversations');
        if (stored) {
            const parsed = JSON.parse(stored);
            parsed.forEach(c => conversations.set(c.id, c));
        }
        const activeId = localStorage.getItem('sparky_active_id');
        if (activeId && conversations.has(activeId)) currentConversationId = activeId;
        if (!currentConversationId || !conversations.has(currentConversationId)) createNewConversation();
        renderHistory();
        renderCurrentChat();
    }

    function createNewConversation() {
        const newId = 'sparky_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        conversations.set(newId, { id: newId, title: 'NEW LINK ESTABLISHED', messages: [], createdAt: Date.now() });
        currentConversationId = newId;
        saveConversations();
        renderHistory();
        renderCurrentChat();
        closeSidebarMobile();
        fetch('/api/conversation/new', { method: 'POST', credentials: 'include' }).catch(e => console.error(e));
    }

    // MODIFIED: Show intro when no messages exist, otherwise render messages
    function renderCurrentChat() {
        const conv = conversations.get(currentConversationId);
        if (!conv) return;
        chatFeed.innerHTML = '';
        if (conv.messages.length === 0) {
            chatFeed.insertAdjacentHTML('beforeend', introHTML);
        } else {
            conv.messages.forEach(msg => {
                if (msg.role === 'user') appendMessageDom('user', msg.content, null);
                else appendMessageDom('ai', msg.content, null, msg.rawHtml);
            });
        }
        scrollToBottom();
        setTimeout(() => applyAntigravityEffect(), 100);
    }

    function appendMessageDom(role, content, attachments = null, customHtml = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;
        if (role === 'user') {
            msgDiv.innerHTML = `<div class="message-bubble">${DOMPurify.sanitize(content)}</div>`;
        } else {
            if (customHtml) msgDiv.innerHTML = `<div class="message-bubble">${customHtml}</div>`;
            else {
                let parsed = marked.parse(content);
                msgDiv.innerHTML = `<div class="message-bubble">${DOMPurify.sanitize(parsed)}</div>`;
                setTimeout(() => msgDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block)), 50);
            }
        }
        chatFeed.appendChild(msgDiv);
        scrollToBottom();
        applyAntigravityEffect();
    }

    function addMessageToConv(role, content, attachments = null, rawHtml = null) {
        const conv = conversations.get(currentConversationId);
        if (!conv) return;
        conv.messages.push({ role, content, attachments: null, timestamp: Date.now(), rawHtml });
        if (role === 'user' && conv.messages.filter(m => m.role === 'user').length === 1) {
            let newTitle = content.slice(0, 25) + (content.length > 25 ? '...' : '');
            conv.title = newTitle.toUpperCase();
            saveConversations();
            renderHistory();
        }
        saveConversations();
        renderCurrentChat();
    }

    function renderHistory() {
        historyListDiv.innerHTML = '';
        const sorted = Array.from(conversations.values()).sort((a,b) => b.createdAt - a.createdAt);
        sorted.forEach(conv => {
            const item = document.createElement('div');
            item.className = `history-item ${conv.id === currentConversationId ? 'active' : ''}`;
            item.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; font-family:'Orbitron', sans-serif; white-space: nowrap;">${conv.title}</span>
                              <button class="delete-conv" data-id="${conv.id}"><i class="fa-solid fa-xmark"></i></button>`;
            item.addEventListener('click', (e) => {
                if (e.target.closest('.delete-conv')) return;
                currentConversationId = conv.id;
                renderCurrentChat();
                renderHistory();
                saveConversations();
                closeSidebarMobile();
            });
            const delBtn = item.querySelector('.delete-conv');
            delBtn.onclick = (e) => {
                e.stopPropagation();
                conversations.delete(conv.id);
                if (currentConversationId === conv.id) createNewConversation();
                renderHistory();
                saveConversations();
                showToast('Link severed');
            };
            historyListDiv.appendChild(item);
        });
    }

    // ----- ENHANCED AI THINKING ANIMATION -----
    function showThinkingLoader() {
        const thinkDiv = document.createElement('div');
        thinkDiv.id = 'thinkLoader';
        thinkDiv.innerHTML = `
            <div class="quantum-thinker">
                <div class="neural-core">
                    <div class="core-ring"></div>
                    <div class="core-ring-reverse"></div>
                    <div class="core-pulse"></div>
                </div>
                <div class="thinking-text">
                    SYSTEM PROCESSING
                    <div class="thinking-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        `;
        chatFeed.appendChild(thinkDiv);
        scrollToBottom();
        return thinkDiv;
    }

    async function submitChat() {
        if (isGenerating) return;
        let text = userInput.value.trim();
        if (!text) return;
        isGenerating = true;
        sendBtn.style.display = 'none';
        stopBtn.style.display = 'flex';
        
        addMessageToConv('user', text);
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        const thinkLoader = showThinkingLoader();
        
        try {
            currentAbortController = new AbortController();
            const systemPrompt = "You are Sparky OS, an advanced cyberpunk AI terminal. Be highly intelligent, concise, and professional. Use markdown for formatting.";
            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: currentAbortController.signal,
                credentials: 'include',
                body: JSON.stringify({
                    model: "deepseek-ai/deepseek-v3.2",
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }],
                    stream: true
                })
            });
            if (thinkLoader) thinkLoader.remove();
            let fullContent = "";
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerHTML = `<div class="message-bubble"></div>`;
            chatFeed.appendChild(aiDiv);
            const bubble = aiDiv.querySelector('.message-bubble');
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for (let line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            fullContent += data.choices[0].delta.content || "";
                            bubble.innerHTML = marked.parse(fullContent);
                            scrollToBottom();
                            setTimeout(() => bubble.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block)), 20);
                        } catch(e) {}
                    }
                }
            }
            addMessageToConv('ai', fullContent);
            speak(fullContent);
        } catch (err) {
            if (thinkLoader) thinkLoader.remove();
            if (err.name !== 'AbortError') {
                addMessageToConv('ai', `⚠️ CONNECTION LOST: ${err.message}. Node 3000 offline.`);
                showToast('System Link Failed');
            }
        } finally {
            sendBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            isGenerating = false;
            sendBtn.disabled = !userInput.value.trim();
        }
    }

    function speak(text) {
        if (!isAudioEnabled) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, ''));
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.onstart = () => micBtn.classList.add('recording');
        recognition.onend = () => micBtn.classList.remove('recording');
        recognition.onresult = (e) => {
            userInput.value = e.results[0][0].transcript;
            sendBtn.disabled = false;
        };
        micBtn.onclick = () => recognition.start();
    } else micBtn.style.opacity = '0.5';

    voiceToggleBtn.onclick = () => {
        isAudioEnabled = !isAudioEnabled;
        voiceToggleBtn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
        if(!isAudioEnabled) window.speechSynthesis.cancel();
    };

    themeBtn.onclick = () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'aurora' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        themeBtn.innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
        applyAntigravityEffect();
    };

    newChatBtn.onclick = () => createNewConversation();
    
    clearAllBtn.onclick = () => {
        if (confirm('Initiate core wipe? All data will be destroyed.')) {
            conversations.clear();
            createNewConversation();
            renderHistory();
            showToast('Core Purged');
            closeSidebarMobile();
        }
    };

    // Sidebar Toggle Logic Setup for Desktop and Mobile
    toggleSidebarBtn.onclick = () => {
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('mobile-open');
            sidebarOverlay.classList.toggle('active');
        } else {
            sidebar.classList.toggle('hidden');
        }
    };

    sidebarOverlay.onclick = closeSidebarMobile;

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
        sendBtn.disabled = (this.value.trim() === '');
    });
    userInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChat(); } });
    sendBtn.onclick = (e) => { e.preventDefault(); submitChat(); };
    stopBtn.onclick = () => { if(currentAbortController) currentAbortController.abort(); const loader = document.getElementById('thinkLoader'); if(loader) loader.remove(); isGenerating = false; sendBtn.style.display = 'flex'; stopBtn.style.display = 'none'; sendBtn.disabled = !userInput.value.trim(); };
    
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST', credentials: 'include' });
            window.location.href = '/login.html';
        });
    }

    async function addAdminButtonIfNeeded() {
        try {
            const res = await fetch('/api/user', { credentials: 'include' });
            const data = await res.json();
            if (data.user && data.user.role === 'admin') {
                const footer = document.querySelector('.sidebar-footer');
                const adminBtn = document.createElement('button');
                adminBtn.className = 'new-chat-btn';
                adminBtn.id = 'adminDashboardBtn';
                adminBtn.style.background = 'rgba(59,130,246,0.1)';
                adminBtn.style.marginTop = '8px';
                adminBtn.innerHTML = '<i class="fa-solid fa-terminal"></i> SYSTEM ADMIN';
                adminBtn.onclick = () => window.location.href = '/admin.html';
                const existingLogout = document.getElementById('logoutBtn');
                if (existingLogout) footer.insertBefore(adminBtn, existingLogout);
                else footer.appendChild(adminBtn);
            }
        } catch (err) {}
    }
    
    loadConversations();
    sendBtn.disabled = true;
    setTimeout(() => applyAntigravityEffect(), 200);
    addAdminButtonIfNeeded();
</script>
</body>
</html>
